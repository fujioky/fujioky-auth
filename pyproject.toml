[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fujioky-auth"
version = "0.1.0"
description = "Shared FastAPI Logto login, sessions and account management for Fujioky apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "sqlalchemy>=2.0", "authlib>=1.3,<2", "httpx>=0.27", "itsdangerous>=2.2", "cryptography>=43"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/fujioky/fujioky-auth"
Issues = "https://github.com/fujioky/fujioky-auth/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
